; ============================================================
; Window Resizer Configuration File
; ============================================================

[Hotkeys]
; ^ = Ctrl, ! = Alt, + = Shift, # = Win
Shrink=^+m
Fullscreen=^+f
Restore=^+r

[Settings]
; 縮小サイズ (物理ピクセル)
TinyWidth=1
TinyHeight=1

; 音響フィードバック (1: 有効, 0: 無効)
SoundFeedback=1

; ツールチップ通知表示 (1: 有効, 0: 無効)
ShowToolTips=1